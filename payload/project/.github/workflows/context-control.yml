name: context-control

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check prompt_toolkit==3.0.53
      - name: Compile control plane
        run: >-
          python -m py_compile
          .agents/skills/context-guardian/scripts/contextctl.py
          .agents/skills/context-guardian/scripts/rollover_stop_hook.py
          .agents/tools/codex-continuous/claude_ui.py
          .agents/tools/codex-continuous/continuous_cli.py
      - name: Run control-plane tests
        run: python .agents/skills/context-guardian/scripts/test_contextctl.py -v
      - name: Run Desktop continuation guard tests
        run: python -m unittest discover -s .agents/skills/context-guardian/scripts -p "test_rollover_stop_hook.py" -v
      - name: Run continuous-controller regressions
        run: python -m unittest discover -s .agents/tools/codex-continuous -p "test_continuous_cli.py" -v
      - name: Run continuous UI regressions
        run: python -m unittest discover -s .agents/tools/codex-continuous -p "test_claude_ui.py" -v
