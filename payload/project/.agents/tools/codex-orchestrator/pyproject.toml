[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-durable-orchestrator"
version = "0.1.0"
description = "Fail-closed durable Codex orchestration backed by Temporal"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "openai-codex==0.144.4",
  "temporalio==1.30.0",
]

[project.scripts]
codex-orchestrator = "codex_orchestrator.cli:main"
codex-orchestrator-worker = "codex_orchestrator.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
