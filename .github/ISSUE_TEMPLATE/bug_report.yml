name: Bug report
description: Report a reproducible installer, verification, or rollback problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, private paths, receipts from a real computer, or raw sensitive logs.
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v6.1.0
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage
      options:
        - Package verification
        - Installation
        - Installed-state verification
        - Rollback
        - Hook or project automation
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and sanitized input
      render: powershell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized literal output and exit status
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, private identifiers, and sensitive paths.
          required: true
        - label: I ran `verify.ps1` before installation.
          required: true
